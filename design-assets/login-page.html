<body class="bg-background text-on-surface antialiased min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">
<!-- Centered Layout -->
<main class="w-full min-h-screen flex flex-col relative z-10 overflow-hidden">
<!-- Form Area -->

<div class="w-full max-w-[440px] flex flex-col">

<div class="w-8 h-8 rounded bg-primary-container flex items-center justify-center shadow-[0_0_15px_rgba(0,255,209,0.3)]">

                            SalesForceX

</div>
<h2 class="font-display-lg text-display-lg text-on-surface mb-2">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access your workspace.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors text-[20px]">
                                mail
                            </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-inner" id="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors text-[20px]">
                                lock
                            </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-inner" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-1 mb-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-container-lowest text-primary-container focus:ring-primary-container focus:ring-offset-surface" type="checkbox">
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary-container hover:text-surface-tint transition-colors hover:underline underline-offset-4" href="#">Forgot password?</a>
</div>

<script>
        // Simple script to toggle password visibility
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[type="button"]:has(span.material-symbols-outlined:contains("visibility"))');
            const passInput = document.getElementById('password');
            
            // This is a naive selector fallback if :has isn't perfectly supported, 
            // but in modern contexts it's fine. Let's do a robust vanilla approach:
            const passGroups = document.querySelectorAll('input[type="password"]');
            passGroups.forEach(input => {
                const btn = input.nextElementSibling;
                if(btn && btn.tagName === 'BUTTON') {
                    btn.addEventListener('click', () => {
                        const icon = btn.querySelector('.material-symbols-outlined');
                        if(input.type === 'password') {
                            input.type = 'text';
                            icon.textContent = 'visibility';
                        } else {
                            input.type = 'password';
                            icon.textContent = 'visibility_off';
                        }
                    });
                }
            });
        });
    </script>

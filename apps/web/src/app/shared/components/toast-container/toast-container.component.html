<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 max-w-md w-full pointer-events-none">
  <div
    *ngFor="let toast of toasts$ | async"
    class="flex items-start gap-3 px-4 py-3 rounded-lg shadow-xl backdrop-blur-sm animate-in slide-in-from-right duration-300 pointer-events-auto"
    [ngClass]="{
      'bg-success/90 text-on-success border border-success': toast.type === 'success',
      'bg-error/90 text-on-error border border-error': toast.type === 'error',
      'bg-warning/90 text-on-warning border border-warning': toast.type === 'warning',
      'bg-primary/90 text-on-primary border border-primary': toast.type === 'info'
    }"
  >
    <!-- Icon -->
    <span class="material-symbols-outlined flex-shrink-0 text-xl">
      {{ toast.type === 'success' ? 'check_circle' : toast.type === 'error' ? 'error' : toast.type === 'warning' ? 'warning' : 'info' }}
    </span>

    <!-- Message -->
    <div class="flex-1 font-body-sm text-body-sm">
      {{ toast.message }}
    </div>

    <!-- Close button -->
    <button
      (click)="remove(toast.id)"
      class="flex-shrink-0 p-1 rounded-full hover:bg-black/10 transition-colors"
      aria-label="Fechar"
    >
      <span class="material-symbols-outlined text-lg">close</span>
    </button>
  </div>
</div>

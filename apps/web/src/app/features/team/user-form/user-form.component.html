<div class="modal-backdrop" *ngIf="visible" (click)="close()"></div>

<div class="modal" *ngIf="visible" role="dialog" aria-modal="true">
  <div class="modal-header">
    <h2 class="modal-title">{{ isEdit ? 'Editar Usuário' : 'Convidar Usuário' }}</h2>
    <button class="modal-close" (click)="close()" aria-label="Fechar" [disabled]="saving">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="modal-body">
    <div *ngIf="error" class="auth-error" style="margin-bottom:16px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error }}
    </div>

    <form (ngSubmit)="submit()">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="user-name">Nome <span style="color:var(--color-danger)">*</span></label>
          <input
            id="user-name"
            type="text"
            class="form-input"
            placeholder="Ex: João Silva"
            [(ngModel)]="form.name"
            name="name"
            required
            [disabled]="saving"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="user-role">Cargo</label>
          <select
            id="user-role"
            class="form-input"
            [(ngModel)]="form.role"
            name="role"
            [disabled]="saving || (isEdit && !isAdmin)"
          >
            <option *ngFor="let opt of availableRoles" [value]="opt.value">{{ opt.label }}</option>
          </select>
        </div>
      </div>

      <!-- E-mail (only on create) -->
      <div *ngIf="!isEdit" class="form-group">
        <label class="form-label" for="user-email">E-mail <span style="color:var(--color-danger)">*</span></label>
        <input
          id="user-email"
          type="email"
          class="form-input"
          placeholder="Ex: joao@empresa.com"
          [(ngModel)]="form.email"
          name="email"
          required
          [disabled]="saving"
        />
      </div>

      <!-- Temporary password (only on create) -->
      <div *ngIf="!isEdit" class="form-group">
        <label class="form-label" for="user-password">Senha Temporária <span style="color:var(--color-danger)">*</span></label>
        <div class="input-with-action">
          <input
            id="user-password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-input"
            placeholder="Mín. 8 caracteres, letras e números"
            [(ngModel)]="form.temporaryPassword"
            name="temporaryPassword"
            required
            [disabled]="saving"
          />
          <button type="button" class="input-action-btn" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Manager assignment (only for SELLER role) -->
      <div *ngIf="form.role === 'SELLER'" class="form-group">
        <label class="form-label" for="user-manager">Gerente Responsável</label>
        <select
          id="user-manager"
          class="form-input"
          [(ngModel)]="form.managerId"
          name="managerId"
          [disabled]="saving || isManager"
        >
          <option [ngValue]="null">Sem gerente</option>
          <option *ngFor="let m of managers" [value]="m.id">{{ m.name }}</option>
        </select>
        <p *ngIf="isManager" class="form-hint">Vendedores criados por você são atribuídos automaticamente.</p>
      </div>

      <!-- Active status (edit only) -->
      <div *ngIf="isEdit && isAdmin" class="form-group">
        <label class="form-label">Status</label>
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="form.isActive" name="isActive" [disabled]="saving" />
          <span class="toggle-switch"></span>
          <span>{{ form.isActive ? 'Ativo' : 'Inativo' }}</span>
        </label>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button class="btn-ghost" type="button" (click)="close()" [disabled]="saving">Cancelar</button>
    <button class="btn-primary" type="button" (click)="submit()" [disabled]="saving || !form.name.trim()">
      <svg *ngIf="saving" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spinner-icon">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      {{ saving ? 'Salvando...' : (isEdit ? 'Salvar Alterações' : 'Convidar') }}
    </button>
  </div>
</div>

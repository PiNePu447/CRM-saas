<div class="modal-backdrop" *ngIf="visible" (click)="close()"></div>

<div class="modal" *ngIf="visible" role="dialog" aria-modal="true">
  <div class="modal-header">
    <h2 class="modal-title">{{ isEdit ? 'Editar Empresa' : 'Nova Empresa' }}</h2>
    <button class="modal-close" (click)="close()" aria-label="Fechar" [disabled]="saving">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="modal-body">
    <div *ngIf="error" class="auth-error" style="margin-bottom:16px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error }}
    </div>

    <form (ngSubmit)="submit()" #companyForm="ngForm">
      <div class="form-group">
        <label class="form-label" for="company-name">Nome da Empresa <span style="color:var(--color-danger)">*</span></label>
        <input
          id="company-name"
          type="text"
          class="form-input"
          placeholder="Ex: Acme Corp"
          [(ngModel)]="form.name"
          name="name"
          required
          [disabled]="saving"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="company-domain">Domínio</label>
          <input
            id="company-domain"
            type="text"
            class="form-input"
            placeholder="ex: acmecorp.com"
            [(ngModel)]="form.domain"
            name="domain"
            [disabled]="saving"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="company-size">Tamanho</label>
          <select id="company-size" class="form-input" [(ngModel)]="form.size" name="size" [disabled]="saving">
            <option value="">Selecionar...</option>
            <option *ngFor="let opt of sizeOptions" [value]="opt">{{ opt }} funcionários</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="company-industry">Setor / Indústria</label>
          <input
            id="company-industry"
            type="text"
            class="form-input"
            placeholder="Ex: Tecnologia, Saúde..."
            [(ngModel)]="form.industry"
            name="industry"
            [disabled]="saving"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="company-status">Status</label>
          <select id="company-status" class="form-input" [(ngModel)]="form.status" name="status" [disabled]="saving">
            <option *ngFor="let opt of statusOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
        </div>
      </div>

      <!-- Owner (seller) assignment — only for ADMIN/MANAGER -->
      <div *ngIf="isAdminOrManager" class="form-group">
        <label class="form-label" for="company-owner">Vendedor Responsável</label>
        <select id="company-owner" class="form-input" [(ngModel)]="form.ownerId" name="ownerId" [disabled]="saving">
          <option [ngValue]="null">Sem responsável</option>
          <option *ngFor="let s of sellers" [value]="s.id">{{ s.name }}</option>
        </select>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button class="btn-ghost" type="button" (click)="close()" [disabled]="saving">Cancelar</button>
    <button class="btn-primary" type="button" (click)="submit()" [disabled]="saving || !form.name.trim()">
      <svg *ngIf="saving" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spinner-icon">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      {{ saving ? 'Salvando...' : (isEdit ? 'Salvar Alterações' : 'Criar Empresa') }}
    </button>
  </div>
</div>

<div class="modal-backdrop" (click)="close()"></div>
<div class="modal modal-wide">

  <!-- ── Header ── -->
  <div class="modal-header">
    <div style="display:flex;align-items:center;gap:8px">
      <button *ngIf="view !== 'list'" class="btn-ghost btn-icon" (click)="backToList()" title="Voltar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 class="modal-title">
        <ng-container *ngIf="view === 'list'">Configurar Pipelines</ng-container>
        <ng-container *ngIf="view === 'edit-pipeline' && !selectedPipeline">Novo Pipeline</ng-container>
        <ng-container *ngIf="view === 'edit-pipeline' && selectedPipeline">Renomear Pipeline</ng-container>
        <ng-container *ngIf="view === 'edit-stages'">{{ selectedPipeline?.name }}</ng-container>
      </h2>
    </div>
    <button class="modal-close" (click)="close()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="modal-body">
    <div *ngIf="error" class="alert-error" style="margin-bottom:16px">{{ error }}</div>

    <!-- ══ VIEW: list ══ -->
    <div *ngIf="view === 'list'">
      <div *ngIf="pipelines.length === 0" class="empty-state" style="padding:32px 0">
        <p>Nenhum pipeline criado ainda.</p>
      </div>

      <div class="pipeline-settings-list">
        <div *ngFor="let p of pipelines" class="pipeline-settings-item">
          <div class="pipeline-settings-info">
            <span class="pipeline-settings-name">{{ p.name }}</span>
            <span *ngIf="p.isDefault" class="badge-default">Padrão</span>
          </div>
          <div class="pipeline-settings-actions">
            <button
              *ngIf="!p.isDefault"
              class="btn-ghost btn-sm"
              (click)="setDefault(p)"
              title="Definir como padrão"
            >
              Definir padrão
            </button>
            <button class="btn-ghost btn-sm" (click)="openEditPipeline(p)" title="Editar estágios">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              Estágios
            </button>
            <button class="btn-ghost btn-sm" (click)="openRenamePipeline(p)" title="Renomear">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn-ghost btn-sm btn-danger-ghost" (click)="deletePipeline(p)" title="Remover pipeline">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div style="margin-top:16px">
        <button class="btn-secondary" (click)="openCreatePipeline()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo Pipeline
        </button>
      </div>
    </div>

    <!-- ══ VIEW: edit-pipeline (create / rename) ══ -->
    <div *ngIf="view === 'edit-pipeline'">
      <div class="form-group">
        <label class="form-label">Nome do pipeline <span class="required">*</span></label>
        <input
          type="text"
          class="form-input"
          [ngModel]="selectedPipeline ? pipelineName : newPipelineName"
          (ngModelChange)="selectedPipeline ? (pipelineName = $event) : (newPipelineName = $event)"
          placeholder="Ex: Vendas"
          autofocus
        />
      </div>
      <div class="modal-footer" style="padding:0;margin-top:24px">
        <button type="button" class="btn-ghost" (click)="backToList()">Cancelar</button>
        <button
          type="button"
          class="btn-primary"
          [disabled]="saving || (selectedPipeline ? !pipelineName.trim() : !newPipelineName.trim())"
          (click)="selectedPipeline ? savePipelineName() : createPipeline()"
        >
          <span *ngIf="!saving">{{ selectedPipeline ? 'Salvar' : 'Criar Pipeline' }}</span>
          <span *ngIf="saving"><span class="spinner"></span></span>
        </button>
      </div>
    </div>

    <!-- ══ VIEW: edit-stages ══ -->
    <div *ngIf="view === 'edit-stages' && selectedPipeline">

      <!-- Stage list -->
      <div class="stage-list">
        <div *ngFor="let stage of selectedPipeline.stages; let i = index; let last = last" class="stage-row">

          <!-- Viewing mode -->
          <ng-container *ngIf="editingStage?.id !== stage.id">
            <div class="stage-row-left">
              <div class="stage-color-dot" [style.background]="stage.color"></div>
              <span class="stage-name">{{ stage.name }}</span>
              <span class="stage-prob">{{ stage.probabilityDefault }}%</span>
            </div>
            <div class="stage-row-actions">
              <button class="btn-ghost btn-icon" (click)="moveStageUp(stage)" [disabled]="i === 0" title="Mover para cima">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
              <button class="btn-ghost btn-icon" (click)="moveStageDown(stage)" [disabled]="last" title="Mover para baixo">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <button class="btn-ghost btn-icon" (click)="startEditStage(stage)" title="Editar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="btn-ghost btn-icon btn-danger-ghost" (click)="deleteStage(stage)" title="Remover">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              </button>
            </div>
          </ng-container>

          <!-- Editing mode -->
          <ng-container *ngIf="editingStage?.id === stage.id">
            <div class="stage-edit-row">
              <input type="color" class="color-picker-input" [(ngModel)]="editStageColor" />
              <input type="text" class="form-input stage-name-input" [(ngModel)]="editStageName" placeholder="Nome do estágio" />
              <div class="stage-prob-field">
                <input type="number" class="form-input stage-prob-input" [(ngModel)]="editStageProbability" min="0" max="100" />
                <span class="prob-suffix">%</span>
              </div>
              <button class="btn-primary btn-sm" (click)="saveStage()" [disabled]="saving || !editStageName.trim()">Salvar</button>
              <button class="btn-ghost btn-sm" (click)="cancelEditStage()">Cancelar</button>
            </div>
          </ng-container>
        </div>

        <div *ngIf="selectedPipeline.stages.length === 0" class="empty-state" style="padding:16px 0">
          <p>Nenhum estágio criado. Adicione o primeiro abaixo.</p>
        </div>
      </div>

      <!-- Add new stage -->
      <div class="add-stage-form">
        <h3 class="add-stage-title">Adicionar Estágio</h3>
        <div class="stage-edit-row">
          <input type="color" class="color-picker-input" [(ngModel)]="newStageColor" />
          <input type="text" class="form-input stage-name-input" [(ngModel)]="newStageName" placeholder="Nome do estágio" />
          <div class="stage-prob-field">
            <input type="number" class="form-input stage-prob-input" [(ngModel)]="newStageProbability" min="0" max="100" />
            <span class="prob-suffix">%</span>
          </div>
          <button class="btn-secondary btn-sm" (click)="addStage()" [disabled]="saving || !newStageName.trim()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Adicionar
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

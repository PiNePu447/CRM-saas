<div class="modal-backdrop" (click)="close()"></div>
<div class="modal">
  <div class="modal-header">
    <h2 class="modal-title">{{ task ? 'Editar Tarefa' : 'Nova Tarefa' }}</h2>
    <button class="modal-close" (click)="close()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
    <div *ngIf="error" class="alert-error">{{ error }}</div>

    <div class="form-group">
      <label class="form-label">Título <span class="required">*</span></label>
      <input
        type="text"
        class="form-input"
        formControlName="title"
        placeholder="Ex: Ligar para cliente"
        [class.input-error]="form.get('title')?.invalid && form.get('title')?.touched"
      />
      <span *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="field-error">
        Título é obrigatório (mínimo 2 caracteres)
      </span>
    </div>

    <div class="form-group">
      <label class="form-label">Descrição</label>
      <textarea
        class="form-textarea"
        formControlName="description"
        placeholder="Detalhes da tarefa..."
        rows="3"
      ></textarea>
    </div>

    <div class="form-group" *ngIf="canAssignTasks">
      <label class="form-label">Funcionário <span class="required">*</span></label>
      <select class="form-input" formControlName="assignedTo">
        <option value="">Selecione um funcionário</option>
        <option *ngFor="let user of assignableUsers" [value]="user.id">
          {{ user.name }} ({{ user.role === 'ADMIN' ? 'Admin' : user.role === 'MANAGER' ? 'Gerente' : 'Vendedor' }})
        </option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Data e hora de vencimento</label>
      <input
        type="datetime-local"
        class="form-input"
        formControlName="dueDate"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Contato (opcional)</label>
      <select class="form-input" formControlName="contactId">
        <option value="">Nenhum contato</option>
        <option *ngFor="let c of contacts" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-ghost" (click)="close()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid || saving">
        <span *ngIf="!saving">{{ task ? 'Salvar alterações' : 'Criar tarefa' }}</span>
        <span *ngIf="saving"><span class="spinner"></span></span>
      </button>
    </div>
  </form>
</div>

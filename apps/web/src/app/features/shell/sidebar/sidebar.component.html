<aside 
  class="fixed top-0 left-0 h-screen bg-surface border-r border-outline-variant flex flex-col z-50 transition-all duration-300 lg:translate-x-0"
  [class.w-[280px]]="!collapsed"
  [class.w-[200px]]="collapsed"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <!-- Logo Area -->
  <div class="flex items-center gap-3 px-stack-sm py-stack-md border-b border-outline-variant min-h-[64px]">
    <div *ngIf="authService.currentUser$ | async as user" class="w-8 h-8 rounded bg-primary-container flex items-center justify-center shadow-primary-glow flex-shrink-0 overflow-hidden">
      <img 
        *ngIf="getTenantLogo(user)"
        [src]="getTenantLogo(user)" 
        [alt]="getTenantName(user)"
        class="w-full h-full object-cover" />
      <span 
        *ngIf="!getTenantLogo(user)"
        class="material-symbols-outlined text-on-primary-container text-xl">domain</span>
    </div>
    <ng-container *ngIf="authService.currentUser$ | async as user">
      <div class="flex-1 min-w-0">
        <h1 class="font-headline-sm text-headline-sm font-bold text-primary truncate" [class.text-sm]="collapsed">
          {{ getTenantName(user) }}
        </h1>
        <p *ngIf="!collapsed" class="font-label-sm text-label-sm text-outline">CRM</p>
      </div>
    </ng-container>
    <button 
      *ngIf="!collapsed"
      class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors lg:hidden flex-shrink-0" 
      (click)="onNavClick()" 
      aria-label="Fechar menu"
    >
      <span class="material-symbols-outlined">close</span>
    </button>
    <button 
      class="p-1.5 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors hidden lg:flex flex-shrink-0"
      (click)="onToggleCollapse()"
      [title]="collapsed ? 'Expandir menu' : 'Recolher menu'"
    >
      <span class="material-symbols-outlined text-lg">
        {{ collapsed ? 'chevron_right' : 'chevron_left' }}
      </span>
    </button>
  </div>

  <!-- Main Navigation -->
  <nav class="flex-1 px-stack-sm py-stack-sm flex flex-col gap-1 overflow-y-auto">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="bg-surface-container-high text-primary border-l-2 border-primary"
      [routerLinkActiveOptions]="{exact: false}"
      class="flex items-center gap-stack-md px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors duration-200"
      [class.justify-center]="collapsed"
      [title]="collapsed ? item.label : ''"
      (click)="onNavClick()"
    >
      <span class="material-symbols-outlined" [class.font-variation-settings-fill]="isActive(item.route)">
        {{ item.icon }}
      </span>
      <span *ngIf="!collapsed" class="font-label-md text-label-md">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Footer Navigation -->
  <div class="px-stack-sm pb-stack-sm flex flex-col gap-1 border-t border-outline-variant pt-stack-sm">
    <a 
      href="#" 
      class="flex items-center gap-stack-md px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors duration-200"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Ajuda' : ''"
      (click)="$event.preventDefault()"
    >
      <span class="material-symbols-outlined">help</span>
      <span *ngIf="!collapsed" class="font-label-md text-label-md">Ajuda</span>
    </a>
    <button 
      (click)="logout()" 
      class="flex items-center gap-stack-md px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors duration-200 w-full text-left"
      [class.justify-center]="collapsed"
      [title]="collapsed ? 'Sair' : ''"
    >
      <span class="material-symbols-outlined">logout</span>
      <span *ngIf="!collapsed" class="font-label-md text-label-md">Sair</span>
    </button>
  </div>
</aside>

<!-- Mobile Overlay -->
<div 
  *ngIf="isOpen"
  class="fixed inset-0 bg-black/50 z-40 lg:hidden"
  (click)="onNavClick()"
></div>

<aside 
  class="fixed top-0 left-0 h-screen w-[280px] bg-surface border-r border-outline-variant flex flex-col z-50 transition-transform duration-300 lg:translate-x-0"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <!-- Logo Area -->
  <div class="flex items-center gap-3 px-stack-sm py-stack-md border-b border-outline-variant">
    <div class="w-8 h-8 rounded bg-primary-container flex items-center justify-center shadow-primary-glow">
      <span class="material-symbols-outlined text-on-primary-container text-xl">domain</span>
    </div>
    <div>
      <h1 class="font-headline-sm text-headline-sm font-bold text-primary">SalesForceX</h1>
      <p class="font-label-sm text-label-sm text-outline">Enterprise Tier</p>
    </div>
    <button 
      class="ml-auto p-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors lg:hidden" 
      (click)="onNavClick()" 
      aria-label="Fechar menu"
    >
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <!-- Main Navigation -->
  <nav class="flex-1 px-stack-sm py-stack-sm flex flex-col gap-1 overflow-y-auto">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="bg-surface-container-high text-primary border-l-2 border-primary"
      [routerLinkActiveOptions]="{exact: false}"
      class="flex items-center gap-stack-md px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors duration-200"
      (click)="onNavClick()"
    >
      <span class="material-symbols-outlined" [class.font-variation-settings-fill]="isActive(item.route)">
        {{ item.icon }}
      </span>
      <span class="font-label-md text-label-md">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Footer Navigation -->
  <div class="px-stack-sm pb-stack-sm flex flex-col gap-1 border-t border-outline-variant pt-stack-sm">
    <a 
      href="#" 
      class="flex items-center gap-stack-md px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors duration-200"
      (click)="$event.preventDefault()"
    >
      <span class="material-symbols-outlined">help</span>
      <span class="font-label-md text-label-md">Ajuda</span>
    </a>
    <button 
      (click)="logout()" 
      class="flex items-center gap-stack-md px-3 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors duration-200 w-full text-left"
    >
      <span class="material-symbols-outlined">logout</span>
      <span class="font-label-md text-label-md">Sair</span>
    </button>
  </div>
</aside>

<!-- Mobile Overlay -->
<div 
  *ngIf="isOpen"
  class="fixed inset-0 bg-black/50 z-40 lg:hidden"
  (click)="onNavClick()"
></div>

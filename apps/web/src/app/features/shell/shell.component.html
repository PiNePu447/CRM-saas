<div class="min-h-screen bg-surface-bright">
  <app-sidebar [isOpen]="sidebarOpen" (closed)="closeSidebar()"></app-sidebar>
  <app-topbar></app-topbar>
  
  <!-- Mobile Header -->
  <div class="fixed top-0 left-0 right-0 h-16 bg-surface border-b border-outline-variant flex items-center px-4 z-30 lg:hidden">
    <button 
      class="p-2 -ml-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors" 
      (click)="openSidebar()" 
      aria-label="Abrir menu"
    >
      <span class="material-symbols-outlined">menu</span>
    </button>
    <h1 class="ml-3 font-headline-sm text-headline-sm font-bold text-primary">SalesForceX</h1>
  </div>
  
  <!-- Main Content Area -->
  <div class="lg:ml-[280px] min-h-screen pt-16 lg:pt-16">
    <router-outlet></router-outlet>
  </div>
</div>

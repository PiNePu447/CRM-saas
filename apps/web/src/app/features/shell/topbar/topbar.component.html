<header 
  class="hidden lg:block fixed top-0 right-0 h-16 bg-surface border-b border-outline-variant z-30 transition-all duration-300"
  [class.left-[280px]]="!collapsed"
  [class.left-[200px]]="collapsed">
  <div class="h-full max-w-container-max mx-auto px-gutter flex justify-end items-center">
    <!-- Trailing Actions & Profile -->
    <div class="flex items-center gap-stack-sm">
      <app-notifications-dropdown></app-notifications-dropdown>
      <div class="ml-2">
        <app-profile-menu></app-profile-menu>
      </div>
    </div>
  </div>
</header>
